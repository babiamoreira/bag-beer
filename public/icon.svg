<svg width="100%" viewBox="0 0 690 690" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ícone app bag-beer</title>
  <desc>Ícone quadrado do app bag-beer com caneca de chop</desc>

  <!-- Fundo quadrado com cantos arredondados estilo app icon -->
  <rect width="680" height="680" rx="148" fill="#111111"/>

  <!-- Caneca de chop -->
  <g transform="translate(340, 340)">

    <!-- Corpo da caneca (trapezoide) -->
    <path d="M-110,-130 L-120,150 L100,150 L110,-130 Z" fill="#F5C518"/>

    <!-- Alça da caneca -->
    <path d="M110,-60 Q185,-60 185,20 Q185,100 110,100" fill="none" stroke="#F5C518" stroke-width="28" stroke-linecap="round"/>
    <!-- Furo da alça (fundo escuro) -->
    <path d="M110,-22 Q152,-22 152,20 Q152,62 110,62" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>

    <!-- Base da caneca -->
    <rect x="-120" y="150" width="220" height="16" rx="6" fill="#D4A800"/>

    <!-- Espuma -->
    <ellipse cx="-20" cy="-130" rx="92" ry="22" fill="#FFFBE6"/>
    <ellipse cx="-55" cy="-146" rx="32" ry="20" fill="#FFFBE6"/>
    <ellipse cx="-18" cy="-152" rx="26" ry="18" fill="#FFFBE6"/>
    <ellipse cx="20" cy="-148" rx="22" ry="16" fill="#FFFBE6"/>
    <ellipse cx="52" cy="-140" rx="28" ry="17" fill="#FFFBE6"/>

    <!-- Reflexo -->
    <rect x="-80" y="-110" width="18" height="200" rx="9" fill="#FFFFFF" opacity="0.10"/>

    <!-- Bolinhas de bolha -->
    <circle cx="-30" cy="80" r="5" fill="#D4A800" opacity="0.5"/>
    <circle cx="10" cy="30" r="4" fill="#D4A800" opacity="0.4"/>
    <circle cx="-60" cy="10" r="3" fill="#D4A800" opacity="0.35"/>
    <circle cx="50" cy="70" r="4" fill="#D4A800" opacity="0.4"/>

  </g>

  <!-- Texto bag-beer -->
  <text x="340" y="570" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">bag<tspan fill="#F5C518">-</tspan>beer</text>

</svg>
